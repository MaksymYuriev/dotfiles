# tmux config — sessions group topics, one agent per window (see ~/.local/bin/agent)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g detach-on-destroy no-detached
# keep window names as set by `agent` (Claude Code otherwise retitles them)
set -g allow-rename off
setw -g automatic-rename off

# Status bar: uses the terminal's ANSI palette (Ghostty: Catppuccin Mocha/Latte), so it follows light/dark automatically.
# Left: other sessions dimmed, current one blue; ● = an agent in that session waits for you. Then the windows of this session.
# @needs-input is a window option set by Claude Code hooks (~/.claude/hooks/tmux-flag.sh).
set -g status-interval 2
set -g status-style "bg=default,fg=brightblack"
set -g status-left-length 200
set -g status-left "#(~/.local/bin/tmux-sessions)#[fg=brightblack]│ "
set -g status-right ""
set -g window-status-format "#{?@needs-input,#[fg=yellow]● ,}#I:#W  "
set -g window-status-current-format "#[fg=blue,bold]#{?@needs-input,● ,}#I:#W#[default]  "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"

# Clear the marker when you look at that window
set-hook -g client-session-changed "set-option -wu @needs-input"
set-hook -g after-select-window "set-option -wu @needs-input"

# prefix + f: fuzzy switcher over every window of every session
bind f display-popup -E -w 60% -h 50% "~/.local/bin/tmux-switch"

# vi keys in copy mode; y copies to the macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# new windows and splits start in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Panes with vim motions: prefix + h/j/k/l, or Ctrl-h/j/k/l without prefix.
# The Ctrl variant passes the key through when the pane runs (n)vim (~/.local/bin/tmux-is-vim; needs vim-tmux-navigator in Neovim).
# Side effect: Ctrl-l no longer clears the screen in a shell; use prefix + Ctrl-l for that. prefix + l is no longer "last window".
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n C-h if-shell "~/.local/bin/tmux-is-vim '#{pane_tty}'" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "~/.local/bin/tmux-is-vim '#{pane_tty}'" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "~/.local/bin/tmux-is-vim '#{pane_tty}'" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "~/.local/bin/tmux-is-vim '#{pane_tty}'" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l
